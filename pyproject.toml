[project]
name = "taxonomyiq"
version = "1.0.0"
description = "Reproducible product taxonomy classification, inference, evaluation, and monitoring"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3",
  "scikit-learn>=1.4,<2", "numpy>=1.26,<3", "joblib>=1.3,<2",
  "prometheus-client>=0.20,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.7,<1"]
transformers = ["torch>=2.3,<3", "transformers>=4.47,<6", "accelerate>=1.0,<2"]
mlops = ["mlflow>=2.17,<4"]
[project.scripts]
taxonomyiq = "taxonomyiq.cli:main"
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/taxonomyiq"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E9", "F"]
